<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10131c" />
    <title>SuperDashboard</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="SuperDashboard, accueil">
          <span class="brand-mark">S</span>
          <span>SuperDashboard</span>
        </a>
        <div id="accountArea" class="account-area" aria-live="polite"></div>
      </header>

      <section id="welcome" class="welcome panel">
        <p class="eyebrow">Ton espace, au même endroit</p>
        <h1>Un dashboard à toi.</h1>
        <p class="intro">Connecte-toi avec Google pour retrouver tes notes sur tes appareils. Tes données sont enregistrées dans ta base Supabase.</p>
        <button id="loginButton" class="button button-google" type="button">
          <span class="google-mark" aria-hidden="true">G</span>
          Continuer avec Google
        </button>
        <p id="setupMessage" class="hint" hidden></p>
      </section>

      <section id="dashboard" class="dashboard" hidden>
        <div class="dashboard-heading">
          <div>
            <p class="eyebrow">Ton espace personnel</p>
            <h1>Bonjour<span id="firstName"></span> 👋</h1>
          </div>
          <div id="connectionStatus" class="connection-status"></div>
        </div>

        <section class="panel notes-panel">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Espace privé</p>
              <h2>Mes notes</h2>
            </div>
            <span id="noteCount" class="note-count">0</span>
          </div>
          <form id="noteForm" class="note-form">
            <label class="visually-hidden" for="noteInput">Nouvelle note</label>
            <input id="noteInput" name="content" maxlength="500" placeholder="Écris une note…" autocomplete="off" required />
            <button class="button button-primary" type="submit">Ajouter</button>
          </form>
          <p id="noteMessage" class="hint" aria-live="polite"></p>
          <ul id="noteList" class="note-list" aria-live="polite"></ul>
        </section>
      </section>
      <footer><span>Express · Google OAuth · Supabase</span><span id="footerStatus"></span></footer>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
